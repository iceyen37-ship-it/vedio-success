plugins {
    id 'com.android.application'
}
// 手機通知（Firebase）：有 google-services.json 才啟用，沒有也能照常打包
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

// Upload-key signing for Google Play. Values come from environment variables
// (GitHub Actions secrets) or from ~/.gradle/gradle.properties on your own computer.
def signingValue = { String name -> System.getenv(name) ?: (project.findProperty(name) ?: null) }
def keystorePath = signingValue('SWALLOWCARE_KEYSTORE_FILE')
def hasReleaseKey = keystorePath != null && file(keystorePath).exists()

android {
    namespace 'com.ansimjia.swallowcare'
    compileSdk 36

    defaultConfig {
        applicationId "com.ansimjia.swallowcare"
        minSdk 24
        targetSdk 36
        // Increase versionCode by 1 for every upload to Google Play.
        versionCode 13
        versionName "1.2.8"
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(keystorePath)
                storePassword signingValue('SWALLOWCARE_KEYSTORE_PASSWORD')
                keyAlias signingValue('SWALLOWCARE_KEY_ALIAS')
                keyPassword signingValue('SWALLOWCARE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'com.google.android.material:material:1.12.0'
    // Google 登入（手機內建的 Google 帳戶選擇畫面）
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    // 手機通知
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
}
